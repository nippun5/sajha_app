name: sajha_app
description: "Sajha App — Multi-category marketplace for Buy/Sell, Rent Room & Job Search."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation
  go_router: ^14.2.7

  # Fonts
  google_fonts: ^6.3.0

  # Image caching (swap placeholder colors → real API images later)
  cached_network_image: ^3.3.1

  # "Posted X ago" helper
  timeago: ^3.6.1
  flutter_native_splash: ^2.4.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"                    
  image: assets/images/logo.png         
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.png